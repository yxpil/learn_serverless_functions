<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Serverless architecture</title>
<style>body{margin:0;padding:16px;font-family:'Segoe UI',Arial,sans-serif;background:#fff;}svg{width:100%;height:auto;display:block;margin:0 auto;}</style>
</head>
<body>
<svg viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
  </defs>

  <rect x="60" y="140" width="180" height="70" rx="10" fill="#fff7e6" stroke="#d97706" stroke-width="1.5"/>
  <text x="150" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">event</text>
  <text x="150" y="192" text-anchor="middle" font-size="11" fill="#b45309">order.created</text>

  <rect x="380" y="60" width="220" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="490" y="90" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">fn: send_email</text>
  <text x="490" y="112" text-anchor="middle" font-size="10.5" fill="#64748b">runs on demand, stateless</text>

  <rect x="380" y="170" width="220" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="490" y="200" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">fn: update_inventory</text>
  <text x="490" y="222" text-anchor="middle" font-size="10.5" fill="#64748b">runs on demand, stateless</text>

  <line x1="240" y1="165" x2="380" y2="95" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="240" y1="180" x2="380" y2="205" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>

  <text x="500" y="310" text-anchor="middle" font-size="11.5" fill="#64748b">no always-on servers; functions start when the event fires and stop when done.</text>
</svg>
</body>
</html>
